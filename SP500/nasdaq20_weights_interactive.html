<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASDAQ-20 Weight History Dashboard</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }
        
        h1 {
            margin: 0 0 5px 0;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        p.subtitle {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 1024px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background-color: var(--bg-color);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        
        .nav-bar select {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
        }
        
        .nav-bar select:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        
        .nav-btn-group {
            display: flex;
            gap: 6px;
        }
        
        .nav-bar button {
            padding: 8px 14px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }
        
        .nav-bar button:hover:not(:disabled) {
            background-color: #334155;
            border-color: var(--accent-color);
        }
        
        .nav-bar button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        .chart-container {
            position: relative;
            height: 480px;
            width: 100%;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 590px;
        }
        
        .search-box {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            box-sizing: border-box;
        }
        
        .search-box:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        
        .btn-group {
            display: flex;
            gap: 8px;
        }
        
        button {
            padding: 8px 12px;
            background-color: var(--border-color);
            border: none;
            border-radius: 6px;
            color: var(--text-color);
            cursor: pointer;
            font-weight: 500;
            font-size: 12px;
            transition: background-color 0.2s;
        }
        
        button:hover {
            background-color: #475569;
        }
        
        button.btn-accent {
            background-color: var(--accent-color);
            color: #0f172a;
        }
        
        button.btn-accent:hover {
            background-color: var(--accent-hover);
        }
        
        .ticker-list-container {
            overflow-y: auto;
            flex-grow: 1;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-color);
        }
        
        .ticker-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        .ticker-table th {
            position: sticky;
            top: 0;
            background-color: #1e293b;
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-muted);
            font-weight: 600;
        }
        
        .ticker-table td {
            padding: 8px;
            border-bottom: 1px dotted var(--border-color);
        }
        
        .ticker-table tr:hover {
            background-color: rgba(56, 189, 248, 0.05);
        }
        
        .checkbox-cell {
            width: 30px;
            text-align: center;
        }
        
        .ticker-label {
            font-weight: 600;
            cursor: pointer;
            display: block;
            width: 100%;
        }
        
        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            background-color: var(--border-color);
            color: var(--text-muted);
        }
        
        .badge.active {
            background-color: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }
        
        .tip-banner {
            background-color: rgba(56, 189, 248, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>NASDAQ-20 Weight History Dashboard</h1>
            <p class="subtitle">Interactive tracking and comparison of historical rebalancing weights (2007 - 2026)</p>
        </header>
        
        <div class="grid">
            <!-- Chart Card -->
            <div class="card">
                <!-- Sliding Window Navigation Bar -->
                <div class="nav-bar">
                    <div class="nav-btn-group">
                        <button onclick="slideFirst()" id="btnFirst">« First</button>
                        <button onclick="slideLeft()" id="btnPrev">‹ Previous</button>
                    </div>
                    
                    <select id="quarterSelector" onchange="jumpToQuarter(this.value)">
                        <!-- Populated by JS -->
                    </select>
                    
                    <div class="nav-btn-group">
                        <button onclick="slideRight()" id="btnNext">Next ›</button>
                        <button onclick="slideLast()" id="btnLast">Last »</button>
                    </div>
                    
                    <select id="windowSizeSelector" onchange="changeWindowSize(this.value)">
                        <option value="2" selected>View: 2 Quarters</option>
                        <option value="4">View: 1 Year (4 Qtrs)</option>
                        <option value="8">View: 2 Years (8 Qtrs)</option>
                        <option value="999">View: Show All Time</option>
                    </select>
                </div>
                
                <div class="chart-container">
                    <canvas id="weightChart"></canvas>
                </div>
                
                <div class="tip-banner">
                    <strong>💡 Navigation Tip:</strong> Use the <b>Left Arrow (←)</b> and <b>Right Arrow (→)</b> keys on your keyboard to quickly scroll through quarters.
                </div>
            </div>
            
            <!-- Controls Card -->
            <div class="card controls">
                <input type="text" id="tickerSearch" class="search-box" placeholder="Search Ticker...">
                
                <div class="btn-group">
                    <button onclick="resetToTop10()" class="btn-accent">Reset (Top 10)</button>
                    <button onclick="clearAll()">Clear All</button>
                    <button onclick="selectAllVisible()">Select Visible</button>
                </div>
                
                <div class="ticker-list-container">
                    <table class="ticker-table" id="tickerTable">
                        <thead>
                            <tr>
                                <th class="checkbox-cell"><input type="checkbox" id="masterCheckbox" onclick="toggleAllVisible(this)"></th>
                                <th>Ticker</th>
                                 <th id="headerNewPct">New %</th>
                                <th>Change %</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="tickerTableBody">
                            <!-- Populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

            // Re-render table to sort dynamically by new visible weights!
            renderTable(document.getElementById('tickerSearch').value);
        }
        
        function slideLeft() {
            if (currentStartIndex > 0) {
                currentStartIndex--;
                updateChartWindow();
            }
        }
        
        function slideRight() {
            if (currentStartIndex + windowSize < quarters.length) {
                currentStartIndex++;
                updateChartWindow();
            }
        }
        
        function slideFirst() {
            currentStartIndex = 0;
            updateChartWindow();
        }
        
        function slideLast() {
            currentStartIndex = quarters.length - windowSize;
            updateChartWindow();
        }
        
        function jumpToQuarter(indexVal) {
            currentStartIndex = parseInt(indexVal);
            updateChartWindow();
        }
        
        function changeWindowSize(sizeVal) {
            let selectedSize = parseInt(sizeVal);
            if (selectedSize > quarters.length) {
                selectedSize = quarters.length;
            }
            windowSize = selectedSize;
            
            if (currentStartIndex + windowSize > quarters.length) {
                currentStartIndex = quarters.length - windowSize;
            }
            
            populateQuarterSelector();
            updateChartWindow();
        }
        
        // Reset to default top 10 tickers
        function resetToTop10() {
            const top10 = ["MSFT", "INTC", "AMZN", "AAPL", "CSCO", "GOOGL", "META", "ORCL", "GOOG", "SSCC"];
            datasets.forEach((ds) => {
                ds.hidden = !top10.includes(ds.label);
            });
            chart.update();
            renderTable(document.getElementById('tickerSearch').value);
        }
        
        // Clear all selected tickers
        function clearAll() {
            datasets.forEach((ds) => {
                ds.hidden = true;
            });
            chart.update();
            renderTable(document.getElementById('tickerSearch').value);
        }
        
        // Select all visible tickers based on search filter
        function selectAllVisible() {
            const search = document.getElementById('tickerSearch').value.toUpperCase();
            datasets.forEach((ds) => {
                if (!search || ds.label.includes(search)) {
                    ds.hidden = false;
                }
            });
            chart.update();
            renderTable(search);
        }
        
        // Toggle checkbox master
        function toggleAllVisible(master) {
            const search = document.getElementById('tickerSearch').value.toUpperCase();
            datasets.forEach((ds) => {
                if (!search || ds.label.includes(search)) {
                    ds.hidden = !master.checked;
                }
            });
            chart.update();
            renderTable(search);
        }
        
        // Search Filter Event
        document.getElementById('tickerSearch').addEventListener('input', function(e) {
            renderTable(e.target.value);
            document.getElementById('masterCheckbox').checked = false;
        });
        
        // Setup Keyboard Navigation
        document.addEventListener('keydown', function(event) {
            // Ignore keypresses inside search input
            if (document.activeElement === document.getElementById('tickerSearch')) {
                return;
            }
            if (event.key === 'ArrowLeft') {
                slideLeft();
            } else if (event.key === 'ArrowRight') {
                slideRight();
            }
        });
        
        // Initial dashboard setup
        populateQuarterSelector();
        updateChartWindow();
        renderTable();
    </script>
</body>
</html>
